name: build

on:
  push:
    branches: [main]
    # stage0 is the db-signed root of trust; tag v* to cut a release.
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: CI (fmt-check + clippy + test)
        run: make ci

  build:
    name: build-${{ matrix.arch }}
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # Build the db-signed boot disk (ephemeral snakeoil keys) for the arch. No
      # QEMU boot here: GitHub runners lack nested KVM. Boot tests run locally via
      # `make boot-<arch>`.
      - name: Build stage0 boot disk for ${{ matrix.arch }}
        run: make build-${{ matrix.arch }}

      - name: Upload stage0 artifacts for ${{ matrix.arch }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage0-${{ matrix.arch }}
          path: |
            build/${{ matrix.arch }}/boot.disk
            build/${{ matrix.arch }}/BOOT*.EFI
            build/${{ matrix.arch }}/efi-vars.*
            build/${{ matrix.arch }}/dbx.esl
            build/${{ matrix.arch }}/dbx.auth.bin
            build/${{ matrix.arch }}/pcrs.json
            build/${{ matrix.arch }}/os-release
            build/${{ matrix.arch }}/*.cer
            build/${{ matrix.arch }}/*.guid
          if-no-files-found: error

  # ---- Release track (tag: v*) --------------------------------------
  release-stage0:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Download stage0 artifact zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACTS=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)
          for arch in x86_64 aarch64; do
            ARTIFACT_ID=$(echo "$ARTIFACTS" | jq -r ".artifacts[] | select(.name==\"stage0-$arch\") | .id")
            gh api repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip > stage0-${arch}.zip
          done

      # One attestation covering the release zips, every file inside them, and the released
      # harness script. Consumers can verify a zip and extract from it, or verify an extracted file
      # on its own (`gh attestation verify BOOTX64.EFI --repo ...`). Subjects are named via a
      # checksums file so the per-arch copies of same-named files stay distinguishable
      # (x86_64/... vs aarch64/...); verification itself matches by digest.
      - name: List attestation subjects (zips + their contents + qemu-test.sh)
        run: |
          for arch in x86_64 aarch64; do
            mkdir -p "contents/$arch" && unzip -q "stage0-$arch.zip" -d "contents/$arch"
          done
          {
            sha256sum stage0-x86_64.zip stage0-aarch64.zip
            (cd tools && sha256sum qemu-test.sh)
            (cd contents && find . -type f -printf '%P\n' | LC_ALL=C sort | xargs -r -d '\n' sha256sum)
          } > subjects.sha256
          cat subjects.sha256

      - name: Attest stage0 zips, their contents, and qemu-test.sh
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-checksums: subjects.sha256

      - name: Create stage0 release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.ref_name }}
          # Ship the droppable test harness alongside the boot disks so downstreams
          # can test their payloads under this stage0 release.
          files: |
            stage0-x86_64.zip
            stage0-aarch64.zip
            tools/qemu-test.sh
          draft: false
          prerelease: true
          generate_release_notes: true
          make_latest: true

  # ---- QEMU test-harness image (tag: v*) -----------------------------
  # End-user harness: qemu + swtpm + OVMF/AAVMF + the EC2 metadata mock, qemu-test.sh as entrypoint.
  # Published with the stage0 release it ships beside: its firmware boots that release's efi-vars.
  # Multi-arch so it runs identically on amd64 and arm64 hosts (KVM when host == guest arch, TCG
  # otherwise). Consumers pin the digest appended to the release notes below, not the tag.
  release-harness:
    runs-on: ubuntu-latest
    needs: release-stage0
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up QEMU (arm64 layers on the amd64 runner)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}-harness
          tags: |
            type=ref,event=tag
          flavor: |
            latest=false

      - name: Build and push multi-arch harness
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile.harness
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: true

      - name: Attest harness image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ghcr.io/${{ github.repository }}-harness
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Append image digest to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          gh release view "$TAG" -R "${{ github.repository }}" --json body -q .body > notes.md
          {
            echo
            echo "### Test harness image"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository }}-harness@${DIGEST}"
            echo '```'
          } >> notes.md
          gh release edit "$TAG" -R "${{ github.repository }}" --notes-file notes.md
